<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CALCULATOR</h1>
    </header>
       <main>
  <div id="calc-box">
    <section id="screen">
      <input type="text" id="display" readonly placeholder="0" />
    </section>

    <div class="keys">
      <!-- Left side: Numbers & Clear actions -->
      <section id="btnsec">
        <button class="action-btn" id = "clrbtn" data-action="clear">AC</button>
        <button class="action-btn" id = "dltbtn" data-action="delete">Del</button>
       
        <button class="number" data-value="1">1</button>
        <button class="number" data-value="2">2</button>
        <button class="number" data-value="3">3</button>
        <button class="number" data-value="4">4</button>
        <button class="number" data-value="5">5</button>
        <button class="number" data-value="6">6</button>
        <button class="number" data-value="7">7</button>
        <button class="number" data-value="8">8</button>
        <button class="number" data-value="9">9</button>
         <button class="number" data-value="%">%</button>
        <button class="number zero" data-value="0">0</button>
        <button class="number" data-value=".">.</button>
      </section>

      <!-- Right side: Operators -->
      <section id="operators">
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>
        <button class="operator" data-value="-">−</button>
        <button class="operator" data-value="+">+</button>
        <button class="equal" data-action="calculate">=</button>
      </section>
    </div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
